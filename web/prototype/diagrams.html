<figure data-diagram="receive" class="active"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">消息接收与展示流程</text><rect x="50" y="110" width="160" height="76" class="box"/><text x="130" y="142" text-anchor="middle" class="text">平台 Webhook</text><text x="130" y="168" text-anchor="middle" class="small">飞书 / 钉钉</text><path d="M210 148 H290" class="arrow"/><rect x="295" y="110" width="120" height="76" class="box"/><text x="355" y="155" text-anchor="middle" class="text">验签</text><path d="M415 148 H495" class="arrow"/><rect x="500" y="110" width="150" height="76" class="box"/><text x="575" y="142" text-anchor="middle" class="text">统一转换</text><text x="575" y="168" text-anchor="middle" class="small">JSON Schema</text><path d="M650 148 H730" class="arrow"/><rect x="735" y="110" width="140" height="76" class="box"/><text x="805" y="142" text-anchor="middle" class="text">幂等去重</text><text x="805" y="168" text-anchor="middle" class="small">事件唯一键</text><path d="M875 148 H955" class="arrow"/><rect x="960" y="110" width="150" height="76" class="box box-accent"/><text x="1035" y="142" text-anchor="middle" class="text">MySQL 入库</text><text x="1035" y="168" text-anchor="middle" class="small">状态历史</text><path d="M1035 186 V260 H650" class="arrow"/><rect x="500" y="225" width="150" height="76" class="box"/><text x="575" y="257" text-anchor="middle" class="text">WebSocket</text><text x="575" y="283" text-anchor="middle" class="small">实时推送</text><path d="M500 263 H420" class="arrow"/><rect x="260" y="225" width="150" height="76" class="box box-accent"/><text x="335" y="257" text-anchor="middle" class="text">统一入口</text><text x="335" y="283" text-anchor="middle" class="small">消息展示</text><path d="M335 301 V385" class="arrow"/><rect x="250" y="390" width="170" height="82" class="box"/><text x="335" y="423" text-anchor="middle" class="text">断线重连</text><text x="335" y="449" text-anchor="middle" class="small">按游标补拉</text><path d="M355 186 V240" class="arrow bad"/><rect x="285" y="245" width="140" height="70" class="box"/><text x="355" y="274" text-anchor="middle" class="text">验签失败</text><text x="355" y="298" text-anchor="middle" class="small">拒绝并记录</text><text x="50" y="590" class="note">关键约束：验签失败不入库；重复事件不产生重复消息；断线后通过游标补齐。</text></svg></figure>
<figure data-diagram="reply"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">消息处理与回复流程</text><rect x="45" y="120" width="140" height="76" class="box"/><text x="115" y="152" text-anchor="middle" class="text">用户处理</text><text x="115" y="178" text-anchor="middle" class="small">乐观锁</text><path d="M185 158 H260" class="arrow"/><rect x="265" y="120" width="150" height="76" class="box"/><text x="340" y="152" text-anchor="middle" class="text">提交回复</text><text x="340" y="178" text-anchor="middle" class="small">幂等请求 ID</text><path d="M415 158 H490" class="arrow"/><rect x="495" y="120" width="155" height="76" class="box"/><text x="572" y="152" text-anchor="middle" class="text">写入 outbox</text><text x="572" y="178" text-anchor="middle" class="small">同事务保存</text><path d="M650 158 H725" class="arrow"/><rect x="730" y="120" width="140" height="76" class="box box-accent"/><text x="800" y="152" text-anchor="middle" class="text">worker 发送</text><text x="800" y="178" text-anchor="middle" class="small">平台 API</text><path d="M870 158 H945" class="arrow"/><rect x="950" y="120" width="150" height="76" class="box"/><text x="1025" y="152" text-anchor="middle" class="text">平台结果</text><text x="1025" y="178" text-anchor="middle" class="small">成功 / 失败</text><path d="M1025 196 V285 H930" class="arrow"/><rect x="780" y="250" width="145" height="78" class="box"/><text x="852" y="282" text-anchor="middle" class="text">replied</text><text x="852" y="308" text-anchor="middle" class="small">发送成功</text><path d="M780 289 H705" class="arrow"/><rect x="550" y="250" width="150" height="78" class="box box-accent"/><text x="625" y="282" text-anchor="middle" class="text">confirmed</text><text x="625" y="308" text-anchor="middle" class="small">回执 / 补偿查询</text><path d="M550 289 H475" class="arrow"/><rect x="320" y="250" width="150" height="78" class="box"/><text x="395" y="282" text-anchor="middle" class="text">状态回流</text><text x="395" y="308" text-anchor="middle" class="small">WebSocket 推送</text><path d="M800 196 V410" class="arrow bad"/><rect x="710" y="415" width="180" height="88" class="box"/><text x="800" y="448" text-anchor="middle" class="text">send_failed</text><text x="800" y="474" text-anchor="middle" class="small">退避重试 / 人工处理</text><text x="50" y="590" class="note">关键约束：受理只进入 replying；平台发送成功进入 replied；真实回执或补偿查询成功才进入 confirmed。</text></svg></figure>
<figure data-diagram="recovery"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">异常恢复流程</text><rect x="70" y="110" width="170" height="82" class="box"/><text x="155" y="144" text-anchor="middle" class="text">平台调用失败</text><text x="155" y="170" text-anchor="middle" class="small">超时 / 限流 / 凭证</text><path d="M240 151 H330" class="arrow"/><rect x="335" y="110" width="150" height="82" class="box"/><text x="410" y="144" text-anchor="middle" class="text">记录失败</text><text x="410" y="170" text-anchor="middle" class="small">原因 + 次数</text><path d="M485 151 H575" class="arrow"/><rect x="580" y="110" width="180" height="82" class="box box-accent"/><text x="670" y="144" text-anchor="middle" class="text">查询平台状态</text><text x="670" y="170" text-anchor="middle" class="small">防止重复发送</text><path d="M670 192 V270 H520" class="arrow"/><rect x="350" y="235" width="165" height="82" class="box"/><text x="432" y="269" text-anchor="middle" class="text">未送达</text><text x="432" y="295" text-anchor="middle" class="small">指数退避重发</text><path d="M515 276 H590" class="arrow"/><rect x="595" y="235" width="160" height="82" class="box"/><text x="675" y="269" text-anchor="middle" class="text">超过 5 次</text><text x="675" y="295" text-anchor="middle" class="small">进入 dead</text><path d="M670 192 V270 H820" class="arrow"/><rect x="825" y="235" width="170" height="82" class="box box-accent"/><text x="910" y="269" text-anchor="middle" class="text">已送达</text><text x="910" y="295" text-anchor="middle" class="small">replied / confirmed</text><rect x="390" y="390" width="420" height="110" class="lane"/><text x="600" y="430" text-anchor="middle" class="text">恢复策略</text><text x="600" y="462" text-anchor="middle" class="small">0.5s → 1s → 2s → 4s → 8s，最多 5 次</text><text x="50" y="590" class="note">关键约束：重试前先对账，禁止网络超时后直接盲目重发。</text></svg></figure>
<figure data-diagram="architecture"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">系统架构图</text><rect x="55" y="130" width="180" height="100" class="box"/><text x="145" y="168" text-anchor="middle" class="text">Vue Web</text><text x="145" y="196" text-anchor="middle" class="small">消息 / 待办 / 状态</text><path d="M235 180 H310" class="arrow"/><rect x="315" y="130" width="140" height="100" class="box"/><text x="385" y="168" text-anchor="middle" class="text">Nginx</text><text x="385" y="196" text-anchor="middle" class="small">反代 + HTTPS</text><path d="M455 180 H530" class="arrow"/><rect x="535" y="110" width="190" height="140" class="box box-accent"/><text x="630" y="150" text-anchor="middle" class="text">FastAPI 核心</text><text x="630" y="178" text-anchor="middle" class="small">REST / WebSocket</text><text x="630" y="204" text-anchor="middle" class="small">验签 / 状态机</text><path d="M725 160 H800" class="arrow"/><rect x="805" y="105" width="150" height="82" class="box"/><text x="880" y="138" text-anchor="middle" class="text">MySQL 8</text><text x="880" y="164" text-anchor="middle" class="small">消息事实源</text><path d="M725 215 H800" class="arrow"/><rect x="805" y="200" width="150" height="82" class="box"/><text x="880" y="233" text-anchor="middle" class="text">Redis 7</text><text x="880" y="259" text-anchor="middle" class="small">会话 / Token</text><path d="M630 250 V330" class="arrow"/><rect x="535" y="335" width="190" height="95" class="box"/><text x="630" y="370" text-anchor="middle" class="text">Outbox Worker</text><text x="630" y="398" text-anchor="middle" class="small">发送 / 重试 / 补偿</text><path d="M725 382 H820" class="arrow"/><rect x="825" y="330" width="220" height="105" class="box"/><text x="935" y="368" text-anchor="middle" class=" <figure data-diagram="er"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">核心表关系图</text><rect x="60" y="110" width="230" height="130" class="box"/><text x="175" y="142" text-anchor="middle" class="text">platform_accounts</text><text x="175" y="174" text-anchor="middle" class="small">平台应用与凭证引用</text><rect x="430" y="110" width="230" height="130" class="box box-accent"/><text x="545" y="142" text-anchor="middle" class="text">conversations</text><text x="545" y="174" text-anchor="middle" class="small">统一会话</text><path d="M290 175 H430" class="arrow"/><rect x="800" y="95" width="260" height="160" class="box box-accent"/><text x="930" y="130" text-anchor="middle" class="text">messages</text><text x="930" y="160" text-anchor="middle" class="small">统一消息</text><text x="930" y="188" text-anchor="middle" class="small">事件唯一 / 回复幂等 / 版本</text><path d="M660 175 H800" class="arrow"/><rect x="90" y="350" width="230" height="125" class="box"/><text x="205" y="384" text-anchor="middle" class="text">users</text><text x="205" y="414" text-anchor="middle" class="small">统一入口用户</text><rect x="420" y="350" width="250" height="125" class="box"/><text x="545" y="384" text-anchor="middle" class="text">message_status_history</text><text x="545" y="414" text-anchor="middle" class="small">状态流转历史</text><path d="M930 255 V412 H670" class="arrow"/><rect x="780" y="350" width="220" height="125" class="box"/><text x="890" y="384" text-anchor="middle" class="text">attachments</text><text x="890" y="414" text-anchor="middle" class="small">附件元数据</text><path d="M890 350 V255" class="arrow"/><rect x="1020" y="350" width="140" height="125" class="box"/><text x="1090" y="384" text-anchor="middle" class="text">outbox</text><text x="1090" y="414" text-anchor="middle" class="small">发送任务</text><path d="M1060 350 V255" class="arrow"/><text x="50" y="590" class="note">关键约束：消息、状态历史、附件和 outbox 都围绕统一消息记录关联。</text></svg></figure>
<figure data-diagram="state"><svg width="1200" height="640" viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#0f766e"/></marker></defs><text x="48" y="58" class="title">消息状态机</text><rect x="60" y="140" width="130" height="64" class="box"/><text x="125" y="179" text-anchor="middle" class="mono">received</text><path d="M190 172 H260" class="arrow"/><rect x="265" y="140" width="120" height="64" class="box"/><text x="325" y="179" text-anchor="middle" class="mono">stored</text><path d="M385 172 H455" class="arrow"/><rect x="460" y="140" width="135" height="64" class="box"/><text x="527" y="179" text-anchor="middle" class="mono">displayed</text><path d="M595 172 H665" class="arrow"/><rect x="670" y="140" width="140" height="64" class="box"/><text x="740" y="179" text-anchor="middle" class="mono">processed</text><path d="M810 172 H880" class="arrow"/><rect x="885" y="140" width="125" height="64" class="box box-accent"/><text x="947" y="179" text-anchor="middle" class="mono">replying</text><path d="M947 204 V285" class="arrow"/><rect x="885" y="290" width="125" height="64" class="box"/><text x="947" y="329" text-anchor="middle" class="mono">replied</text><path d="M885 322 H810" class="arrow"/><rect x="680" y="290" width="125" height="64" class="box box-accent"/><text x="742" y="329" text-anchor="middle" class="mono">confirmed</text><path d="M947 204 V425" class="arrow bad"/><rect x="880" y="430" width="150" height="70" class="box"/><text x="955" y="471" text-anchor="middle" class="mono">send_failed</text><path d="M880 465 H760" class="arrow"/><rect x="610" y="430" width="145" height="70" class="box"/><text x="682" y="471" text-anchor="middle" class="mono">dead</text><rect x="260" y="300" width="150" height="70" class="box"/><text x="335" y="341" text-anchor="middle" class="mono">parse_failed</text><path d="M125 204 V335 H26
